<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Pagewise Books</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F1E7;--ink:#1F2A28;--green:#2F5D50;--green-dark:#244a40;--clay:#B4471F;--gold:#C9A24B;--sand:#E6D8BE;--card:#fff;--muted:#4a5754}
@media (prefers-color-scheme:dark){:root{--paper:#161d1b;--ink:#F1ECE0;--card:#212b28;--sand:#33403c;--muted:#b8c2bd;--green:#4E8A6F;--green-dark:#5da283}}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0} .wrap{max-width:1100px;margin:0 auto;padding:20px 24px 48px}
.btn{min-height:44px;padding:0 22px;border-radius:999px;border:2px solid transparent;font:600 15px Inter,sans-serif;cursor:pointer;background:var(--green);color:#fff}
.btn:hover{background:var(--green-dark)} .btn.out{background:transparent;border-color:var(--green);color:var(--green)}
input,select{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid #b9ae98;font:16px Inter,sans-serif;background:var(--card);color:var(--ink)}
.card{background:var(--card);border-radius:16px;padding:20px} .hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:24px} #login .card{width:100%;max-width:380px;display:grid;gap:12px} #login h1{font-size:30px}
.err{color:var(--clay);min-height:20px;font-size:14px;margin:0} label{font-size:14px;font-weight:600}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.kpi small{color:var(--muted);display:block} .kpi b{font:700 28px Fraunces,Georgia,serif}
.scroll{overflow-x:auto} table{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--sand)} .pill{padding:2px 10px;border-radius:999px;font-size:13px;background:var(--sand)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px} svg text{fill:var(--muted);font:12px Inter,sans-serif}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge.Pending{background:#FDEBC8;color:#7a4a00} .badge.Shipped{background:#D6EAF8;color:#1a5276} .badge.Delivered{background:#D5F5E3;color:#1e8449}
</style>
</head>
<body>
<section id="login">
<form class="card" id="loginForm" autocomplete="on">
<h1>Pagewise Admin</h1>
<p style="margin:0;color:var(--muted)">Sign in to view your dashboard.</p>
<label for="u">Username</label><input id="u" autocomplete="username" required>
<label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
<p class="err" id="err" role="alert"></p>
<button class="btn" type="submit">Sign in</button>
</form>
</section>

<main id="dash" class="wrap hide">
<div class="top"><h1>Dashboard</h1>
<div class="row" style="margin:0">
<a class="btn out" href="index.html" style="display:inline-flex;align-items:center">View shop</a>
<button type="button" class="btn out" id="authBtn">Log in</button>
</div></div>

<div class="kpis" id="kpis"></div>

<div class="card" style="margin-bottom:20px">
<h2 style="font-size:22px">Revenue - Last 7 Days</h2>
<div class="scroll"><svg id="chart" viewBox="0 0 720 280" width="100%"></svg></div>
<div class="legend"><span>● Revenue - Last 7 Days</span></div>
</div>

<div class="card" style="margin-bottom:20px">
<h2 style="font-size:22px">Sales & Reorder Advice</h2>
<div class="scroll"><table id="tbl"></table></div>
</div>

<div class="card" style="margin-bottom:20px">
<h2 style="font-size:22px">Orders <button class="btn" onclick="render();alert('Na-refresh na! Orders: '+Backend.getOrders().length)" style="font-size:14px;padding:6px 10px;margin-left:10px">🔄 Refresh Orders</button></h2>
<p style="color:var(--muted);margin:6px 0 12px">Recent orders from your shop.</p>
<div class="scroll"><svg id="orderChart" viewBox="0 0 720 220" width="100%"></svg></div>
<div class="kpis" style="margin-top:16px">
<div class="card kpi"><small>Total Orders</small><b id="statOrders">0</b></div>
<div class="card kpi"><small>Total Revenue</small><b id="statRevenue">₱0</b></div>
<div class="card kpi"><small>Pending Orders</small><b id="statPending">0</b></div>
</div>
<div class="scroll"><table id="ordersTbl"></table></div>
</div>

<div class="card">
<h2 style="font-size:22px">Record a sale or restock</h2>
<p id="stockInfo" style="color:var(--muted);margin:8px 0 0">Select a book to see its current stock.</p>
<div class="row">
<select id="sel" aria-label="Title"></select>
<input id="qty" type="number" min="1" value="1" aria-label="Quantity" style="width:100px">
<button class="btn" id="sell">Add sale</button>
<button class="btn out" id="stock">Add stock</button>
<button class="btn out" id="reset">Clear Orders</button>
</div>
<p id="stockMsg" style="margin:10px 0 0;font-weight:600;color:var(--green)"></p>
</div>
</main>

<script src="backend.js"></script>
<script>
const $ = id => document.getElementById(id);
const peso = n => "₱" + Math.round(n || 0).toLocaleString("en-PH");
let showAllOrders = true;

function show(){
  const ok = Backend.isAuthed();
  $("login").classList.toggle("hide", ok);
  $("dash").classList.toggle("hide", !ok);
  const authBtn = $("authBtn");
  if(ok){
    authBtn.textContent = "Log out";
    authBtn.onclick = () => { Backend.logout(); show(); };
    render();
  } else {
    authBtn.textContent = "Log in";
    authBtn.onclick = () => { $("login").classList.remove("hide"); $("dash").classList.add("hide"); };
  }
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("err").textContent = "";
  const r = await Backend.login($("u").value, $("p").value);
  if(r.ok){ $("u").value=""; $("p").value=""; show(); }
  else { $("err").textContent = r.error || "Wrong username or password."; }
});

function barChart(svgId, labels, values, color){
  const svg = $(svgId);
  const W = 720, H = svgId === 'chart' ? 280 : 220, pad = 36;
  const max = Math.max(1, ...values);
  let bars = "";
  const bw = (W - pad*2) / Math.max(1, labels.length);
  values.forEach((v,i)=>{
    const h = (v / max) * (H - pad*2);
    const x = pad + i*bw + bw*0.2;
    const y = H - pad - h;
    bars += `<rect x="${x}" y="${y}" width="${bw*0.6}" height="${h}" rx="6" fill="${color}"></rect><text x="${x + bw*0.3}" y="${H-10}" text-anchor="middle">${labels[i]}</text><text x="${x + bw*0.3}" y="${y-6}" text-anchor="middle">${v ? peso(v) : ''}</text>`;
  });
  svg.innerHTML = bars;
}

function render(){
  const stats = Backend.getOrderStats();
  const data = Backend.getData();
  const orders = Backend.getOrders();
  $("statOrders").textContent = stats.totalOrders;
  $("statRevenue").textContent = peso(stats.totalRevenue);
  $("statPending").textContent = stats.pending;
  $("kpis").innerHTML = `<div class="card kpi"><small>Total Revenue</small><b>${peso(stats.totalRevenue)}</b></div><div class="card kpi"><small>Total Orders</small><b>${stats.totalOrders}</b></div><div class="card kpi"><small>Pending Orders</small><b>${stats.pending}</b></div><div class="card kpi"><small>Books in Stock</small><b>${data.titles.reduce((s,t)=>s+t.stock,0)}</b></div>`;
  barChart('chart', stats.last7.map(d=>d.label), stats.last7.map(d=>d.total), '#2F5D50');
  barChart('orderChart', stats.last7.map(d=>d.label), stats.last7.map(d=>d.total), '#C9A24B');
  let tbl = "<tr><th>Title</th><th>Price</th><th>Stock</th><th>Sold Today</th><th>Advice</th></tr>";
  data.titles.forEach(t=>{
    const need = Math.max(0, 20 - t.stock);
    tbl += `<tr><td>${t.title}</td><td>${peso(t.price)}</td><td>${t.stock} ${t.stock<=10?'⚠️':''}</td><td>${t.units[11]||0}</td><td>${need>0?`Restock +${need} to reach 20`:"Stock OK"}</td></tr>`;
  });
  $("tbl").innerHTML = tbl;
  if(!orders.length){
    $("ordersTbl").innerHTML = "<tr><td>No orders yet.</td></tr>";
  } else {
    const visible = showAllOrders ? orders : orders.slice(0, 5);
    let o = "<tr><th>ID</th><th>Customer</th><th>Book</th><th>Qty</th><th>Total</th><th>Status</th><th>Action</th></tr>";
    visible.forEach(ord=>{
      o += `<tr><td>${ord.id}</td><td>${ord.email||ord.customer||'-'}</td><td>${ord.title}</td><td>${ord.qty}</td><td>${peso(ord.total)}</td><td><span class="badge ${ord.status}">${ord.status}</span></td><td><select onchange="Backend.updateOrderStatus('${ord.id}',this.value);render()"><option ${ord.status==='Pending'?'selected':''}>Pending</option><option ${ord.status==='Shipped'?'selected':''}>Shipped</option><option ${ord.status==='Delivered'?'selected':''}>Delivered</option><option ${ord.status==='Completed'?'selected':''}>Completed</option><option ${ord.status==='Cancelled'?'selected':''}>Cancelled</option></select></td></tr>`;
    });
    $("ordersTbl").innerHTML = o;
    let btn = $("toggleOrdersBtn");
    if(!btn && orders.length > 5){
      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML = `<span style="color:var(--muted);font-size:14px">Showing ${visible.length} of ${orders.length} orders</span><button type="button" class="btn out" id="toggleOrdersBtn">${showAllOrders?"Show Less":"Show All"}</button>`;
      $("ordersTbl").parentElement.after(div);
      $("toggleOrdersBtn").onclick = () => { showAllOrders = !showAllOrders; render(); };
    } else if(btn){ btn.textContent = showAllOrders ? "Show Less" : "Show All"; }
  }
  $("sel").innerHTML = data.titles.map(t=>`<option>${t.title}</option>`).join('');
}

$("sel").addEventListener("change", ()=>{
  const t = Backend.getData().titles.find(x=>x.title===$("sel").value);
  if(t) $("stockInfo").textContent = `${t.title} - Current stock: ${t.stock} pcs - Price: ${peso(t.price)}`;
});

$("sell").onclick = ()=>{
  const t = $("sel").value;
  const q = parseInt($("qty").value,10);
  if(!q || q<=0){ alert("Lagay ka muna ng quantity"); return; }
  if(!confirm(`Mag-a-add ka ng SALE ng ${q} pcs sa "${t}"?\nBabawas to sa stock!`)) return;
  Backend.addSale(t,q); render();
  $("stockMsg").textContent = `Sale recorded: ${q} pcs ng ${t} nabawas sa stock.`;
};

$("stock").onclick = ()=>{
  const t = $("sel").value;
  const q = parseInt($("qty").value,10);
  if(!q || q<=0){ alert("Lagay ka muna ng quantity, hal. 20"); return; }
  const before = Backend.getData().titles.find(x=>x.title===t);
  const oldStock = before ? before.stock : 0;
  if(!confirm(`Mag-a-add ka ng ${q} pcs sa "${t}"?\nDating stock: ${oldStock}\nMagiging: ${oldStock+q}`)) return;
  Backend.restock(t,q); render();
  const after = Backend.getData().titles.find(x=>x.title===t);
  $("stockInfo").textContent = `${t} - Current stock: ${after.stock} pcs`;
  $("stockMsg").textContent = `✅ Na-add na! ${t}: ${oldStock} → ${after.stock} pcs (+${q})`;
  $("qty").value = 1;
};

$("reset").onclick = ()=>{ if(confirm("Clear all orders?")){ Backend.reset(); render(); } };

show();

// AUTO-REFRESH - 3 SECONDS
let lastOrderCount = Backend.getOrders().length;
setInterval(()=>{
  if(!Backend.isAuthed()) return;
  const now = Backend.getOrders().length;
  if(now !== lastOrderCount){
    lastOrderCount = now;
    render();
    const msg = document.getElementById("stockMsg");
    if(msg) msg.textContent = "🔔 May bagong order! Check mo sa baba.";
  } else {
    render();
  }
}, 3000);
</script>
</body>
</html>
